  <style>
    /* =====================================================================
       SISTEMA DE TEMAS (RETRÔ, FRUTIGER AERO, DARK FANTASY, MINECRAFT, BRAT, ETC.)
       ===================================================================== */
    :root,
    html[data-theme="retro-98"] {
      --bg-primary: #3a6ea5;
      --bg-pattern: radial-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 0);
      --bg-pattern-size: 16px 16px;
      --bg-secondary: #d4d0c8;
      --bg-tertiary: #ffffff;
      --border-color: #808080;
      --text-main: #111111;
      --text-muted: #404040;
      --accent-teal: #000080;
      --accent-terracotta: #800000;
      --window-header-bg: linear-gradient(90deg, var(--accent-teal), #1084d0);
      --window-header-text: #ffffff;
      --card-shadow: inset 1px 1px 0px #ffffff, inset -1px -1px 0px #404040, 2px 2px 0px rgba(0,0,0,0.35);
      --inset-shadow: inset 1px 1px 0px #404040, inset -1px -1px 0px #ffffff;
      --btn-shadow: inset 1px 1px 0px #ffffff, inset -1px -1px 0px #404040, 1px 1px 0px #000000;
      --radius-box: 0px;
      --font-body: 'Tahoma', 'Verdana', 'Inter', sans-serif;
    }

    /* CAMERON'S WORLD / GEOCITIES 99 (ESCURO ESTRELADO) */
    html[data-theme="cameron-dark"] {
      color-scheme: dark;
      --bg-primary: #070814;
      --bg-pattern: radial-gradient(#ffffff 1px, transparent 1px), radial-gradient(#fde047 1px, transparent 1px);
      --bg-pattern-size: 44px 44px;
      --bg-secondary: #131629;
      --bg-tertiary: #0b0d1a;
      --border-color: #4f5d95;
      --text-main: #f0f4ff;
      --text-muted: #9aa8d6;
      --accent-teal: #38bdf8;
      --accent-terracotta: #facc15;
      --window-header-bg: linear-gradient(90deg, #1e1b4b, #4338ca, #0f172a);
      --window-header-text: #fde047;
      --card-shadow: inset 1px 1px 0px #6366f1, inset -1px -1px 0px #05060f, 3px 3px 0px #000000;
      --inset-shadow: inset 1px 1px 0px #05060f, inset -1px -1px 0px #312e81;
      --btn-shadow: inset 1px 1px 0px #818cf8, inset -1px -1px 0px #090a14, 1px 1px 0px #000000;
      --radius-box: 0px;
      --font-body: 'Verdana', 'Tahoma', sans-serif;
    }

    /* CADERNO DE PAPEL CLÁSSICO / MAC OS 9 */
    html[data-theme="retro-paper"] {
      color-scheme: light;
      --bg-primary: #e6e2d8;
      --bg-pattern: radial-gradient(#b8b2a6 1px, transparent 1px);
      --bg-pattern-size: 14px 14px;
      --bg-secondary: #fbf9f3;
      --bg-tertiary: #f1ede2;
      --border-color: #1f1e1b;
      --text-main: #181715;
      --text-muted: #57534e;
      --accent-teal: #1e463b;
      --accent-terracotta: #9a3412;
      --window-header-bg: repeating-linear-gradient(0deg, #e5e0d5, #e5e0d5 2px, #fbf9f3 2px, #fbf9f3 4px);
      --window-header-text: #181715;
      --card-shadow: 3px 3px 0px #1f1e1b;
      --inset-shadow: inset 1px 1px 0px rgba(0,0,0,0.12);
      --btn-shadow: 2px 2px 0px #1f1e1b;
      --radius-box: 2px;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    /* 16-BIT RPG / CARTUCHO CLÁSSICO (CLARO) */
    html[data-theme="retro-snes"] {
      color-scheme: light;
      --bg-primary: #cec9cc;
      --bg-pattern: radial-gradient(#a8a2a6 1px, transparent 1px);
      --bg-pattern-size: 12px 12px;
      --bg-secondary: #f4f1ea;
      --bg-tertiary: #e6e1d6;
      --border-color: #3b3540;
      --text-main: #221e26;
      --text-muted: #5a5263;
      --accent-teal: #5b4b8a;
      --accent-terracotta: #b91c1c;
      --window-header-bg: linear-gradient(90deg, #4c3b78, #7e6bc4);
      --window-header-text: #ffffff;
      --card-shadow: inset 1px 1px 0px #ffffff, 3px 3px 0px #3b3540;
      --inset-shadow: inset 1px 1px 0px #8c8594, inset -1px -1px 0px #ffffff;
      --btn-shadow: inset 1px 1px 0px #ffffff, 2px 2px 0px #3b3540;
      --radius-box: 2px;
      --font-body: 'Tahoma', 'Verdana', sans-serif;
    }

    /* MATRIX (ESCURO - CHUVA DIGITAL VERDE FÓSFORO) */
    html[data-theme="matrix"] {
      color-scheme: dark;
      --bg-primary: #020502;
      --bg-pattern:
        repeating-linear-gradient(90deg, rgba(0, 255, 65, 0.07) 0px, rgba(0, 255, 65, 0.07) 1px, transparent 1px, transparent 24px),
        linear-gradient(rgba(0, 255, 65, 0.04) 1px, transparent 1px);
      --bg-pattern-size: 24px 24px, 100% 3px;
      --bg-secondary: #050d06;
      --bg-tertiary: #020803;
      --border-color: #00aa2b;
      --text-main: #65ff86;
      --text-muted: #1db947;
      --accent-teal: #00cc33;
      --accent-terracotta: #00ff41;
      --window-header-bg: linear-gradient(90deg, #003b0d, #007a1e, #020803);
      --window-header-text: #b8ffc8;
      --card-shadow: 0 0 10px rgba(0, 255, 65, 0.16), inset 0 0 1px #00ff41;
      --inset-shadow: inset 0 0 6px rgba(0, 255, 65, 0.18);
      --btn-shadow: 0 0 5px rgba(0, 255, 65, 0.35);
      --radius-box: 0px;
      --font-body: 'IBM Plex Mono', monospace;
    }

    /* FRUTIGER AERO (AQUA GLOSSY 2007 - IMAGEM RICA DE COLAGEM Y2K) */
    html[data-theme="frutiger-aero"] {
      color-scheme: light;
      --bg-primary: #1a91eb;
      --bg-pattern: none;
      --bg-pattern-size: auto;
      --bg-secondary: rgba(242, 251, 255, 0.88);
      --bg-tertiary: rgba(255, 255, 255, 0.94);
      --border-color: #5bb8f5;
      --text-main: #062b49;
      --text-muted: #1b5c8a;
      --accent-teal: #0080d6;
      --accent-terracotta: #14a83b;
      --window-header-bg: linear-gradient(180deg, rgba(164, 224, 255, 0.95) 0%, rgba(41, 154, 232, 0.95) 48%, rgba(8, 118, 204, 0.96) 51%, rgba(75, 187, 255, 0.95) 100%);
      --window-header-text: #ffffff;
      --card-shadow: inset 0 1px 0 #ffffff, 0 6px 18px rgba(0, 68, 130, 0.25);
      --inset-shadow: inset 0 1px 3px rgba(0, 82, 155, 0.14);
      --btn-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 2px 5px rgba(0, 75, 140, 0.22);
      --radius-box: 10px;
      --font-body: 'Segoe UI', 'Tahoma', 'Inter', sans-serif;
    }

    /* DARK FANTASY (100% NÍTIDO - LUA DE SANGUE, CASTELO GÓTICO E VIAJANTE NA FOGUEIRA) */
    html[data-theme="dark-fantasy"] {
      color-scheme: dark;
      --bg-primary: #050a14;
      --bg-pattern: none;
      --bg-pattern-size: auto;
      --bg-secondary: rgba(10, 15, 26, 0.88);
      --bg-tertiary: rgba(6, 9, 17, 0.93);
      --border-color: #5c2828;
      --text-main: #ede6d6;
      --text-muted: #a69c8e;
      --accent-teal: #b91c1c;
      --accent-terracotta: #ea580c;
      --window-header-bg: linear-gradient(90deg, #450a0a 0%, #7f1d1d 45%, #111827 100%);
      --window-header-text: #f5ebd6;
      --card-shadow: inset 1px 1px 0px rgba(220, 38, 38, 0.35), 0 6px 18px rgba(0, 0, 0, 0.85);
      --inset-shadow: inset 1px 1px 3px #020409;
      --btn-shadow: inset 1px 1px 0px rgba(248, 113, 113, 0.35), 2px 2px 0px #000000;
      --radius-box: 2px;
      --font-body: 'Inter', 'Georgia', serif;
    }
    html[data-theme="dark-fantasy"] .retro-titlebar,
    html[data-theme="dark-fantasy"] h1,
    html[data-theme="dark-fantasy"] h2 {
      font-family: 'Cinzel', 'Newsreader', Georgia, serif;
      letter-spacing: 0.05em;
    }

    /* MINECRAFT (JAVA EDITION - MENU DE PEDRA E TOPO DE GRAMA, SUPER LEGÍVEL) */
    html[data-theme="minecraft"] {
      color-scheme: light;
      --bg-primary: #6ea4e8;
      --bg-pattern: none;
      --bg-pattern-size: auto;
      --bg-secondary: #d4d0c8;
      --bg-tertiary: #eef1f5;
      --border-color: #2c2c2c;
      --text-main: #181818;
      --text-muted: #424242;
      --accent-teal: #3c8527;
      --accent-terracotta: #b02e26;
      --window-header-bg: linear-gradient(180deg, #569d34 0%, #468329 38%, #79553a 38%, #5e412b 100%);
      --window-header-text: #ffffff;
      --card-shadow: inset 2px 2px 0px #ffffff, inset -2px -2px 0px #555555, 4px 4px 0px rgba(0,0,0,0.45);
      --inset-shadow: inset 2px 2px 0px #555555, inset -2px -2px 0px #ffffff;
      --btn-shadow: inset 2px 2px 0px #aaaaaa, inset -2px -2px 0px #333333, 2px 2px 0px #000000;
      --radius-box: 0px;
      --font-body: 'Tahoma', 'Verdana', sans-serif;
    }
    html[data-theme="minecraft"] .retro-titlebar {
      font-family: 'VT323', monospace;
      font-size: 15px;
      text-shadow: 2px 2px 0px #1b1b1b;
      letter-spacing: 0.05em;
    }
    html[data-theme="minecraft"] .retro-btn:hover {
      outline: 2px solid #ffffa0 !important;
    }

    /* BRAT (CHARLI XCX - #8ACE00 OFICIAL, ARIAL NARROW LOWERCASE) */
    html[data-theme="brat"] {
      color-scheme: light;
      --bg-primary: #8ACE00;
      --bg-pattern: none;
      --bg-pattern-size: auto;
      --bg-secondary: rgba(138, 206, 0, 0.88);
      --bg-tertiary: #97db0a;
      --border-color: #000000;
      --text-main: #000000;
      --text-muted: #1b2800;
      --accent-teal: #000000;
      --accent-terracotta: #000000;
      --window-header-bg: #000000;
      --window-header-text: #8ACE00;
      --card-shadow: 3px 3px 0px #000000;
      --inset-shadow: inset 1px 1px 0px #000000;
      --btn-shadow: 2px 2px 0px #000000;
      --radius-box: 0px;
      --font-body: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    }
    html[data-theme="brat"] body,
    html[data-theme="brat"] button,
    html[data-theme="brat"] h1,
    html[data-theme="brat"] h2,
    html[data-theme="brat"] h3,
    html[data-theme="brat"] span,
    html[data-theme="brat"] th {
      text-transform: lowercase !important;
      letter-spacing: -0.02em;
    }

    /* JOGOS (CLÁSSICOS 16-BIT: GREEN HILL SONIC, STREET FIGHTER KO, MARIO) */
    html[data-theme="jogos"] {
      color-scheme: light;
      --bg-primary: #1848c8;
      --bg-pattern: none;
      --bg-pattern-size: auto;
      --bg-secondary: #f8f4e8;
      --bg-tertiary: #ffffff;
      --border-color: #181818;
      --text-main: #141414;
      --text-muted: #4a4336;
      --accent-teal: #0058f8;
      --accent-terracotta: #e40058;
      --window-header-bg: linear-gradient(90deg, #d80000 0%, #f8b800 50%, #00a800 100%);
      --window-header-text: #ffffff;
      --card-shadow: inset 2px 2px 0px #ffffff, 4px 4px 0px #000000;
      --inset-shadow: inset 2px 2px 0px #b8b098;
      --btn-shadow: inset 2px 2px 0px #ffffff, 2px 2px 0px #000000;
      --radius-box: 0px;
      --font-body: 'Tahoma', 'Verdana', sans-serif;
    }
    html[data-theme="jogos"] .retro-titlebar {
      text-shadow: 1px 1px 0px #000000;
    }

    /* VAPORWAVE AESTHETIC (SOL LISTRADO, GRADE NEON 3D, PISO XADREZ E ESTÁTUA HELÊNICA) */
    html[data-theme="vaporwave"] {
      color-scheme: dark;
      --bg-primary: #160829;
      --bg-pattern: none;
      --bg-pattern-size: auto;
      --bg-secondary: rgba(29, 13, 54, 0.90);
      --bg-tertiary: rgba(18, 7, 36, 0.94);
      --border-color: #ff71ce;
      --text-main: #fff0fb;
      --text-muted: #01cdfe;
      --accent-teal: #01cdfe;
      --accent-terracotta: #ff71ce;
      --window-header-bg: linear-gradient(90deg, #ff71ce 0%, #b967ff 50%, #01cdfe 100%);
      --window-header-text: #120428;
      --card-shadow: inset 1px 1px 0px #05ffa1, 4px 4px 0px #090214;
      --inset-shadow: inset 1px 1px 0px #090214, inset -1px -1px 0px #b967ff;
      --btn-shadow: 2px 2px 0px #01cdfe;
      --radius-box: 0px;
      --font-body: 'Verdana', 'Tahoma', sans-serif;
    }

    /* TEMA ANTIGO CLARO (PRESERVADO EXATAMENTE COMO ESTAVA) */
    html[data-theme="old-light"] {
      color-scheme: light;
      --bg-primary: #fbfaf8;
      --bg-pattern: none;
      --bg-pattern-size: auto;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f3f1ed;
      --border-color: #e6e2da;
      --text-main: #1f1e1b;
      --text-muted: #6e6a63;
      --accent-teal: #235347;
      --accent-terracotta: #9e4733;
      --window-header-bg: transparent;
      --window-header-text: #1f1e1b;
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      --inset-shadow: none;
      --btn-shadow: none;
      --radius-box: 8px;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* TEMA ANTIGO ESCURO (PRESERVADO EXATAMENTE COMO ESTAVA) */
    html[data-theme="old-dark"] {
      color-scheme: dark;
      --bg-primary: #121314;
      --bg-pattern: none;
      --bg-pattern-size: auto;
      --bg-secondary: #18191b;
      --bg-tertiary: #222428;
      --border-color: #2b2d31;
      --text-main: #ededec;
      --text-muted: #8b8d93;
      --accent-teal: #3b82f6;
      --accent-terracotta: #d97757;
      --window-header-bg: transparent;
      --window-header-text: #ededec;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      --inset-shadow: none;
      --btn-shadow: none;
      --radius-box: 8px;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* CAMADA DE PLANO DE FUNDO ARTÍSTICO DOS TEMAS (LEVE E FIXA) */
    #theme-scenery-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    header,
    .max-w-\[1520px\] {
      position: relative;
      z-index: 10;
    }

    /* Correção definitiva de contraste para todos os <select> e <option> em temas escuros e claros */
    select {
      background-color: var(--bg-tertiary);
      color: var(--text-main);
    }

    function applyTheme() {
      const root = document.documentElement;
      const theme = appState.themeMode || "retro-98";
      root.setAttribute("data-theme", theme);

      const darkThemes = ["cameron-dark", "dark-fantasy", "vaporwave", "matrix", "old-dark"];
      const isDarkTheme = darkThemes.includes(theme);
      if (isDarkTheme) {
        root.classList.add("dark");
      } else {
        root.classList.remove("dark");
      }

      if (appState.customAccent) {
        root.style.setProperty("--accent-teal", appState.customAccent);
      } else {
        root.style.removeProperty("--accent-teal");
      }

      renderThemeScenery(theme);

      const sel = document.getElementById("theme-select");
      if (sel && sel.value !== theme) {
        sel.value = theme;
      }

      const revSel = document.getElementById("rev-algo-select");
      if (revSel && appState.spacedRepMode) {
        revSel.value = appState.spacedRepMode;
      }
    }
